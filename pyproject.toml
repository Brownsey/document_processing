[project]
name = "doc-gen-assignment"
version = "0.1.0"
description = "Document-generation take-home: turn client source material into a finished advice report via a config-driven pipeline."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.26.0",
    "openai>=1.40",
    "pydantic>=2.10",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Generation does not require the development tooling.
dev = [
    "pytest>=8.0",
    "ruff>=0.16.9",
    "ty==0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_pipeline", "src/document_formatter"]

[tool.ruff]
src = ["src"]
target-version = "py310"
extend-exclude = ["src/document_formatter/formatting.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
